<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1800" viewBox="0 0 390 1800"><rect width="390" height="1800" fill="#f3f6f7"/><rect x="15" y="16" width="360" height="60" rx="12" fill="#09283f"/><text x="32" y="52" fill="white" font-family="Arial" font-size="15">UTEM · Carrera · Menú</text><rect x="15" y="90" width="360" height="240" rx="16" fill="#123d57"/><text x="32" y="135" fill="#d5ed74" font-family="Arial" font-size="13">PORTADA · CARRERA · CTA</text><text x="32" y="183" fill="white" font-family="Arial" font-size="23">Construye soluciones</text><text x="32" y="213" fill="white" font-family="Arial" font-size="23">para un mundo</text><text x="32" y="243" fill="white" font-family="Arial" font-size="23">conectado</text><rect x="32" y="271" width="185" height="38" rx="18" fill="#d5ed74"/><text x="47" y="296" fill="#09283f" font-family="Arial" font-size="12">Explorar el plan</text><g fill="white" stroke="#d5dfe2"><rect x="15" y="345" width="360" height="160" rx="14"/><rect x="15" y="520" width="360" height="150" rx="14"/><rect x="15" y="685" width="360" height="230" rx="14"/><rect x="15" y="930" width="360" height="185" rx="14"/><rect x="15" y="1130" width="360" height="160" rx="14"/><rect x="15" y="1305" width="360" height="170" rx="14"/><rect x="15" y="1490" width="360" height="200" rx="14"/></g><g fill="#09283f" font-family="Arial" font-size="15" font-weight="bold"><text x="32" y="380">01 · Carrera + dos afines</text><text x="32" y="555">02 · Perfil de egreso</text><text x="32" y="720">03 · Malla en acordeones</text><text x="32" y="965">04 · Campo laboral / datos</text><text x="32" y="1165">05 · Respaldo y calidad</text><text x="32" y="1340">06 · Admisión 2027</text><text x="32" y="1525">07 · Preguntas frecuentes</text><text x="32" y="1724">Referencias enlazadas al final</text></g><text x="32" y="410" fill="#526674" font-family="Arial" font-size="12">Tarjetas apiladas, lectura vertical y citas a un toque.</text><text x="32" y="750" fill="#526674" font-family="Arial" font-size="12">Cada semestre muestra materias, año y fuente.</text></svg>
